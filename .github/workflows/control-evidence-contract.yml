name: Control Evidence synthetic contract smoke
on:
  push:
    paths:
      - "artifacts/control-evidence-2026/**"
      - ".github/workflows/control-evidence-contract.yml"
  pull_request:
    paths:
      - "artifacts/control-evidence-2026/**"
      - ".github/workflows/control-evidence-contract.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run synthetic contract regression tests
        run: python artifacts/control-evidence-2026/contract_smoke.py -v
      - name: Run prospective blind-packet regression tests
        run: python artifacts/control-evidence-2026/test_blind_packet.py -v
